[package]
name = "aq-wasm"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
#character = { path = "../character" }
#script = { path = "../script" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.23.1"
wasm-encoder = { version = "0.262.0", features = ["wasmparser"] }
wasmparser = "0.262.0"

[dev-dependencies]
wasmtime = "50.0.0"
wat = "1.262.0"
